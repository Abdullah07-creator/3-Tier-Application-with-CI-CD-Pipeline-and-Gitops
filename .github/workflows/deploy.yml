name: "3-Tier App DevSecOps CI/CD Pipeline"

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: "Build, Scan, Push & Deploy"
    runs-on: ubuntu-latest

    steps:
# Checkout repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

#Configure AWS CLI Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
#Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

#Build, Tag, and Push Backend Image to ECR
      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/three-tier-backend:$IMAGE_TAG ./backend
          docker build -t $ECR_REGISTRY/three-tier-backend:v1 ./backend
          docker push $ECR_REGISTRY/three-tier-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/three-tier-backend:v1

# Build, Tag, and Push Frontend Image to ECR
      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/three-tier-frontend:$IMAGE_TAG ./frontend
          docker build -t $ECR_REGISTRY/three-tier-frontend:v1 ./frontend
          docker push $ECR_REGISTRY/three-tier-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/three-tier-frontend:v1

#Update Kubeconfig context for EKS
      - name: Update Kubeconfig Context
        run: |
          aws eks update-kubeconfig --region us-east-1 --name three-tier-eks-cluster

#Deploy / Upgrade Helm Chart on Amazon EKS
      - name: Deploy Helm Chart to EKS
        run: |
          helm upgrade --install three-tier-release ./helm/three-tier-app \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }}