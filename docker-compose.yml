version: '3.8'

services:
  # Tier 1: Database Layer
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tier 2: Backend Logic Layer
  backend-api:
    build:
      context: ./backend
    container_name: backend-api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres-db
      DB_NAME: taskdb
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_PORT: "5432"
    depends_on:
      postgres-db:
        condition: service_healthy

  # Tier 3: Frontend Presentation Layer
  frontend-ui:
    build:
      context: ./frontend
    container_name: frontend-ui
    ports:
      - "3000:80"
    depends_on:
      - backend-api

volumes:
  pgdata: